apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      imagePullSecrets:
        - name: gcr-json-key
      containers:
        - image: asia-south1-docker.pkg.dev/sleepr-430609/payments/production
          name: payments
          env:
            - name: PORT
              value: '3001'
            - name: NOTIFICATION_TCP_HOST
              value: notifications
            - name: NOTIFICATION_TCP_PORT
              value: '3000'
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe
                  key: STRIPE_SECRET_KEY
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: '500m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '512Mi'
