services:
  e2e:
    build:
      dockerfile: ./Dockerfile
    volumes:
      - ./specs:/app/specs
    depends_on:
      - reservations
      - auth
      - payments
      - notifications
      - mongo

  reservations:
    image: asia-south1-docker.pkg.dev/sleepr-430609/reservations/production
    env_file:
      - ../apps/reservations/.env
    ports:
      - '3000:3000'

  auth:
    image: asia-south1-docker.pkg.dev/sleepr-430609/auth/production
    env_file:
      - ../apps/auth/.env
    ports:
      - '3001:3001'

  payments:
    image: asia-south1-docker.pkg.dev/sleepr-430609/payments/production
    env_file:
      - ../apps/payments/.env

  notifications:
    image: asia-south1-docker.pkg.dev/sleepr-430609/notifications/production
    env_file:
      - ../apps/notifications/.env

  mongo:
    image: mongo
